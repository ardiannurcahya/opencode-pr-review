# Server configuration
server:
  port: 8080
  webhook_secret: "${WEBHOOK_SECRET}"

# GitHub App configuration
github:
  app_id: 123456
  private_key_path: "./github-app.private-key.pem"

# OpenCode Engine configuration
opencode:
  # Optional: URL of persistent OpenCode headless server (e.g. opencode serve --port 4096)
  server_url: "http://127.0.0.1:4096"
  server_password: "${OPENCODE_SERVER_PASSWORD}"
  # Default model (can use custom provider from opencode.json like: custom/claude-sonnet-4-6)
  default_model: "custom/claude-sonnet-4-6"
  # Optional: custom agent name from opencode.json (e.g. reviewer). Uses OpenCode default agent if omitted.
  # agent: "reviewer"
  timeout_seconds: 300

# Git workspaces configuration
workspace:
  base_dir: "./workspaces"
  clean_after_review: false

# Background Worker & Queue configuration
worker:
  concurrency: 2 # Number of PR reviews to process in parallel
  poll_interval_ms: 3000 # Queue polling interval in milliseconds

# Repositories configuration
repositories:
  # ==========================================================
  # REPOSITORY 1: Uses default universal prompts/review.md
  # ==========================================================
  your-org/common-service:
    enabled: true
    base_branch: "main"
    model: "custom/claude-sonnet-4-6" # Custom provider model from opencode.json
    custom_prompt: |
      - Ensure unit tests are added for any bug fixes under the tests/ directory.

  # ==========================================================
  # REPOSITORY 2: Open Source Library (uses opensource example)
  # ==========================================================
  your-org/my-oss-library:
    enabled: true
    base_branch: "main"
    prompt_file: "./prompts/examples/opensource-community.md"
    model: "custom/claude-sonnet-4-6"

  # ==========================================================
  # REPOSITORY 3: Sensitive Backend Service (uses internal example)
  # ==========================================================
  your-org/payment-gateway:
    enabled: true
    base_branch: "main"
    prompt_file: "./prompts/examples/internal-backend.md"
    model: "custom/gpt-5-model"
    custom_prompt: |
      - Double check PCI-DSS compliance and credit card data masking.
